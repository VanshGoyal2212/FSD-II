<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#c6edee;
    font-family:Arial, Helvetica, sans-serif;
}

.login-box{
    display:flex;
    flex-direction:column;
    gap:15px;
    width:350px;
    padding:30px;
    background:rgb(237,241,178);
    border:2px solid #000;
    border-radius:10px;
    box-shadow:2px 2px 10px rgba(0,0,0,0.2);
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

label{
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #555;
    border-radius:5px;
    font-size:16px;
}

button{
    padding:10px;
    background:#fd3402;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#d92b00;
}
</style>

</head>
<body>

<div class="login-box">
    <h1><u>Login</u></h1>

    <label>Username</label>
    <input type="text" placeholder="Enter your Username">

    <label>Password</label>
    <input type="password" placeholder="Enter your Password">

    <button>Login</button>
</div>

</body>
</html>
